# Sitio principal
server {
    listen 443 ssl;
    server_name jetdeliveryapp.com www.jetdeliveryapp.com;

    client_max_body_size 64M;

    root /var/www/jetdeliveryapp.com/html;
    index index.html index.htm;

    ssl_certificate /etc/letsencrypt/live/jetdeliveryapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetdeliveryapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Admin (panel Laravel)
server {
    listen 443 ssl;
    server_name admin.jetdeliveryapp.com;

    client_max_body_size 64M;

    root /var/www/admin.jetdeliveryapp.com/html/public;
    index index.php index.html index.htm;

    ssl_certificate /etc/letsencrypt/live/jetdeliveryapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetdeliveryapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# HTTP -> HTTPS principal
server {
    listen 80;
    server_name jetdeliveryapp.com www.jetdeliveryapp.com;
    return 301 https://$host$request_uri;
}

# HTTP -> HTTPS admin
server {
    listen 80;
    server_name admin.jetdeliveryapp.com;
    return 301 https://$host$request_uri;
}